networks:
  default:
    name: shared_network
    external: true
services:
  partner_php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: app
    container_name: partner_php
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      # HANYA storage & config — BUKAN seluruh source code.
      # public/js, public/css, mix-manifest.json hasil build webpack
      # datang dari image (COPY di Dockerfile), bukan dari host.
      - ./storage:/var/www/html/storage
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
    environment:
      - PHP_OPCACHE_ENABLE=1

  partner_nginx:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: web
    container_name: partner_nginx
    restart: unless-stopped
    ports:
      - "8084:80"
    volumes:
      # Hanya config nginx — public/ sudah ikut ter-bake di image (stage "web")
      - ./docker/nginx/default.conf.template:/etc/nginx/templates/default.conf.template
    environment:
      - PHP_HOST=${PHP_HOST:-partner_php}
    depends_on:
      - partner_php
