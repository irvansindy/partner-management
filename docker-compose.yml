networks:
  default:
    name: shared_network
    external: true

services:

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: partner_php
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
    environment:
      - PHP_OPCACHE_ENABLE=1

  nginx:
    image: nginx:1.25-alpine
    container_name: partner_nginx
    restart: unless-stopped
    ports:
      - "8084:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf.template:/etc/nginx/templates/default.conf.template
    environment:
      - PHP_HOST=${PHP_HOST:-php}    # default ke "php" kalau tidak di-set
    depends_on:
      - php