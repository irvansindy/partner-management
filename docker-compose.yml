networks:
  partner_internal:
    driver: bridge
  shared_network:
    external: true

services:

  # ─── PHP-FPM ───────────────────────────────────────────────────────────────
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: partner_php
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
    environment:
      - PHP_OPCACHE_ENABLE=1
    networks:
      - partner_internal       # komunikasi dengan Nginx
      - shared_network         # akses ke shared_mysql

  # ─── Nginx ─────────────────────────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: partner_nginx
    restart: unless-stopped
    ports:
      - "8084:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    networks:
      - partner_internal       # hanya perlu bicara ke PHP